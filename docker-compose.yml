services:
  db:
    image: postgres:16
    container_name: intern-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      CANDIDATE_DB_NAME: ${CANDIDATE_DB_NAME:-candidate_db}
      MESSAGE_DB_NAME: ${MESSAGE_DB_NAME:-message_db}
      RECRUITMENT_DB_NAME: ${RECRUITMENT_DB_NAME:-recruitment_db}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/auth-service
    env_file: ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      CANDIDATE_SERVICE_URL: http://candidate-service:8082
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"

  candidate-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/candidate-service
    env_file: ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      CANDIDATE_PORT: 8082
      CANDIDATE_DB_NAME: ${CANDIDATE_DB_NAME:-candidate_db}
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      CANDIDATE_SERVICE_URL: http://candidate-service:8082
    depends_on:
      db:
        condition: service_healthy

  recruitment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/recruitment-service
    env_file: ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      RECRUITMENT_PORT: 8083
      RECRUITMENT_DB_NAME: ${RECRUITMENT_DB_NAME:-recruitment_db}
      CANDIDATE_SERVICE_URL: http://candidate-service:8082
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
    depends_on:
      db:
        condition: service_healthy

  message-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/message-service
    env_file: ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      MESSAGE_DB_NAME: ${MESSAGE_DB_NAME:-message_db}
      CANDIDATE_SERVICE_URL: http://candidate-service:8082
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MESSAGE_PORT}:${MESSAGE_PORT}"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: gateway
    env_file: ${ENV_FILE:-.env.docker}
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CANDIDATE_SERVICE_URL: http://candidate-service:8082
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8083
      MESSAGE_SERVICE_URL: http://message-service:8084
    depends_on:
      - auth-service
      - candidate-service
      - recruitment-service
      - message-service
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"

volumes:
  pgdata:
