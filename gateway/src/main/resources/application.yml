server:
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcmF1dGhjb21wb25lbnRzZWNyZXRrZXkxMjM0NTY=}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      forwarded-headers-strategy: framework
      default-filters:
        - PreserveHostHeader
        - AddResponseHeader=X-Gateway, InternshipGateway
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: candidate-service-profile
          uri: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/profile/**
          filters:
            - PreserveHostHeader

        - id: recruitment-service-jobs
          uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/internship-post/**, /api/jobs/**, /api/job-posts/**, /api/skill/**, /api/skills/**, /api/skill-categories/**, /api/industries/**
          filters:
            - PreserveHostHeader

        - id: message-service
          uri: ${MESSAGE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/message/**, /api/v1/messages/**, /api/v1/conversations/**, /ws/**
        #          filters:
        #            - StripPrefix=1
        #            - PreserveHostHeader

        - id: candidate-service-cv
          uri: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/cv/**
        #          filters:
        #            - StripPrefix=1
        #            - PreserveHostHeader

        - id: recruitment-service-applying
          uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/applying/**
          filters:
            - PreserveHostHeader

        - id: candidate-service-matching
          uri: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/matching/**
          filters:
            - PreserveHostHeader
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
