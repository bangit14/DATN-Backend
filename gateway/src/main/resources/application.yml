server:
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcmF1dGhjb21wb25lbnRzZWNyZXRrZXkxMjM0NTY=}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      forwarded-headers-strategy: framework
      default-filters:
        - PreserveHostHeader
        - AddResponseHeader=X-Gateway, JobPortalGateway
      routes:
        # Internal Docker ports: auth=8081, candidate=8082,
        # recruitment=8083 and message=8084.
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: candidate-service
          uri: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/profile/**, /api/cv/**, /api/matching/**
          filters:
            - PreserveHostHeader

        - id: recruitment-service
          uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/internship-post/**, /api/jobs/**, /api/job-posts/**, /api/skill/**, /api/skills/**, /api/skill-categories/**, /api/industries/**, /api/applying/**
          filters:
            - PreserveHostHeader

        - id: message-service
          uri: ${MESSAGE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/message/**, /ws/**
          filters:
            - PreserveHostHeader
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
