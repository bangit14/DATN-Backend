server:
  port: ${MESSAGE_PORT:8084}

spring:
  application:
    name: message-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MESSAGE_DB_NAME:message_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework: INFO
    org.apache.ibatis: DEBUG
    com.backend.message_service.mapper.db: DEBUG

aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:job-portal-bucket}
  access-key-id: ${AWS_ACCESS_KEY_ID:test-access-key}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}

integrations:
  candidate:
    profile-internal-api-url: ${CANDIDATE_SERVICE_URL:http://localhost:8082}/api/profile/internal
