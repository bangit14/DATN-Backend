server:
  port: ${RECRUITMENT_PORT:8083}

spring:
  application:
    name: recruitment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RECRUITMENT_DB_NAME:recruitment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # Dùng cùng biến JWT_SECRET với auth-service và api-gateway.
  secret: ${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcmF1dGhjb21wb25lbnRzZWNyZXRrZXkxMjM0NTY=}

# URLs are centralized here; job and application domains use logical targets.
integrations:
  candidate:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
  recruitment:
    base-url: ${RECRUITMENT_SERVICE_URL:http://localhost:${RECRUITMENT_PORT:8083}}
  matching:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
  ai-nlp:
    base-url: ${AI_NLP_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
