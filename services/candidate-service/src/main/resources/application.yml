server:
  port: ${CANDIDATE_PORT:8082}

spring:
  application:
    name: candidate-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${CANDIDATE_DB_NAME:candidate_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.backend.candidateservice.profile.config
  configuration:
    map-underscore-to-camel-case: true

# AWS S3 is shared by avatar and CV-document domains.
aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:it-job}
jwt:
  # Dùng cùng biến JWT_SECRET với auth-service và api-gateway.
  secret: ${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcmF1dGhjb21wb25lbnRzZWNyZXRrZXkxMjM0NTY=}

# URLs are kept here so domain code does not depend on Docker service names.
integrations:
  candidate:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:${CANDIDATE_PORT:8082}}
  recruitment:
    base-url: ${RECRUITMENT_SERVICE_URL:http://localhost:${RECRUITMENT_PORT:8083}}
  matching:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:${CANDIDATE_PORT:8082}}
  ai-nlp:
    base-url: ${AI_NLP_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
