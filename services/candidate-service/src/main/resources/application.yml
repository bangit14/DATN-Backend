server:
  port: ${CANDIDATE_PORT:8082}

spring:
  application:
    name: candidate-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intern_network}?currentSchema=${CANDIDATE_DB_SCHEMA:candidate_schema}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: ${CANDIDATE_DB_SCHEMA:candidate_schema}
    default-schema: ${CANDIDATE_DB_SCHEMA:candidate_schema}
    create-schemas: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.backend.candidateservice.profile.config
  configuration:
    map-underscore-to-camel-case: true

# AWS S3 is shared by avatar and CV-document domains.
aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:it-job}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

jwt:
  secret: ${JWT_SECRET}

# URLs are kept here so domain code does not depend on Docker service names.
integrations:
  candidate:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:${CANDIDATE_PORT:8082}}
  recruitment:
    base-url: ${RECRUITMENT_SERVICE_URL:http://localhost:${RECRUITMENT_PORT:8083}}
  matching:
    base-url: ${CANDIDATE_SERVICE_URL:http://localhost:${CANDIDATE_PORT:8082}}
  ai-nlp:
    base-url: ${AI_NLP_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
