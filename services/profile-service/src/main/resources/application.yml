server:
  port: ${PROFILE_PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:profile_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.backend.profileservice.config
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:job-portal-bucket}
  access-key-id: ${AWS_ACCESS_KEY_ID:test-access-key}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}

logging:
  level:
    org.springframework.web: DEBUG
    org.apache.ibatis: DEBUG
    com.backend.profileservice.mapper.db: DEBUG

services:
  skill:
    base-url: http://localhost:8083